<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.18" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.88" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow2)"/>

  <!-- Mark: stacked usage bars being swept down -->
  <g transform="translate(150 96)">
    <rect x="0" y="0" width="128" height="18" rx="9" fill="#1e293b"/>
    <rect x="0" y="0" width="112" height="18" rx="9" fill="#f43f5e"/>
    <rect x="0" y="32" width="128" height="18" rx="9" fill="#1e293b"/>
    <rect x="0" y="32" width="78" height="18" rx="9" fill="#f59e0b"/>
    <rect x="0" y="64" width="128" height="18" rx="9" fill="#1e293b"/>
    <rect x="0" y="64" width="44" height="18" rx="9" fill="#22c55e"/>
    <rect x="0" y="96" width="128" height="18" rx="9" fill="#1e293b"/>
    <rect x="0" y="96" width="20" height="18" rx="9" fill="#22d3ee"/>
  </g>

  <text x="330" y="168" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" letter-spacing="-3" fill="url(#title)">fagia</text>
  <text x="336" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" fill="#cbd5e1">See what's eating your disk and RAM.</text>
  <text x="336" y="262" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="30" fill="#94a3b8">Reclaim it safely.</text>
</svg>
