[package]
name = "fagia"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fagia-core = { version = "0.1.0", path = "../fagia-core" }
fagia-tui = { version = "0.1.0", path = "../fagia-tui" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "filters"] }
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "fagia"
path = "src/main.rs"
